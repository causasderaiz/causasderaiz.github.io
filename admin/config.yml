# Editor Causas de Raiz (Sveltia CMS) em https://causasderaiz.org/admin/
# Grava diretamente no ramo main (decisão da Sílvia, 3 out. 2026: colaboradores autónomos);
# (junção de rascunhos em main; a publicação automática só corre em main).
# Login: GitHub, através do serviço sveltia-cms-auth no Cloudflare (conta do Causas de Raiz).
backend:
  name: github
  repo: causasderaiz/causasderaiz-src
  branch: main
  base_url: https://sveltia-cms-auth.causasderaiz.workers.dev
  commit_messages:
    create: "Editor: novo caso {{slug}}"
    update: "Editor: atualiza {{slug}}"
    delete: "Editor: apaga {{slug}}"
    uploadMedia: "Editor: carrega foto {{path}}"
    deleteMedia: "Editor: apaga foto {{path}}"
locale: pt
media_folder: src/images/originals/img
public_folder: /img
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: casos
    label: "Casos"
    label_singular: "Caso"
    folder: src/casos
    extension: json
    format: json
    create: true
    identifier_field: id
    slug: "{{fields.id}}"
    summary: "{{num}} · {{pt.t}}"
    sortable_fields: [num, verif]
    fields:
      - { label: "Identificador (vira o endereço da página)", name: id, widget: string, pattern: ['^[a-z0-9-]+$', 'Só letras minúsculas, números e hífenes'] }
      - { label: "Número do caso", name: num, widget: number, value_type: int, hint: "Usar o número livre mais baixo (reports/numeros-livres.md)" }
      - { label: "Região", name: reg, widget: select, options: [{label: "Norte", value: "norte"}, {label: "Centro", value: "centro"}, {label: "Lisboa e Vale do Tejo", value: "lisboa-e-vale-do-tejo"}, {label: "Alentejo", value: "alentejo"}, {label: "Algarve", value: "algarve"}, {label: "Madeira", value: "madeira"}, {label: "Açores", value: "acores"}, {label: "Nacional", value: "nacional"}] }
      - { label: "Tema", name: cat, widget: select, options: [{label: "Mineração e pedreiras", value: "mineracao"}, {label: "Energia", value: "energia"}, {label: "Eólicas", value: "eolicas"}, {label: "MegaSolares", value: "megasolares"}, {label: "Data centers", value: "datacenter"}, {label: "Água", value: "agua"}, {label: "Resíduos", value: "residuos"}, {label: "Floresta e incêndios", value: "incendios"}, {label: "Agropecuária e agricultura intensiva", value: "agropecuaria"}, {label: "Turismo", value: "turismo"}, {label: "Imobiliário, urbanismo e habitação", value: "imobiliario"}, {label: "Infraestrutura e transportes", value: "infraestrutura"}, {label: "Indústria e poluição", value: "poluicao"}, {label: "Conservação da natureza", value: "biodiversidade"}, {label: "Praias e litoral", value: "praias"}, {label: "Arvoredo urbano", value: "arvoredo"}], hint: "A atividade que causa o conflito. Racismo ambiental e Comunidade vão em Outros temas." }
      - { label: "Outros temas", name: cat2, widget: select, multiple: true, required: false, options: [{label: "Mineração e pedreiras", value: "mineracao"}, {label: "Energia", value: "energia"}, {label: "Eólicas", value: "eolicas"}, {label: "MegaSolares", value: "megasolares"}, {label: "Data centers", value: "datacenter"}, {label: "Água", value: "agua"}, {label: "Resíduos", value: "residuos"}, {label: "Floresta e incêndios", value: "incendios"}, {label: "Agropecuária e agricultura intensiva", value: "agropecuaria"}, {label: "Turismo", value: "turismo"}, {label: "Imobiliário, urbanismo e habitação", value: "imobiliario"}, {label: "Infraestrutura e transportes", value: "infraestrutura"}, {label: "Indústria e poluição", value: "poluicao"}, {label: "Conservação da natureza", value: "biodiversidade"}, {label: "Praias e litoral", value: "praias"}, {label: "Arvoredo urbano", value: "arvoredo"}, {label: "Racismo ambiental", value: "racismo-ambiental"}, {label: "Comunidade e saúde pública", value: "comunidade"}] }
      - { label: "Estado", name: est, widget: select, options: [{label: "Situação ativa", value: "ativo"}, {label: "Consulta pública", value: "consulta"}, {label: "Processo judicial", value: "tribunal"}, {label: "Vitória", value: "vitoria"}, {label: "Acompanhamento", value: "acompanhamento"}, {label: "Red flag (sob vigilância)", value: "vigilancia"}] }
      - { label: "Prazo a fechar", name: prazo, required: false, widget: boolean, default: false }
      - { label: "Verificado em (data em que leste as fontes)", name: verif, widget: datetime, time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Coordenadas [latitude, longitude]", name: ll, required: false, widget: list, field: { label: "Coordenada", name: c, widget: number, value_type: float }, hint: "Ex.: 41.6897 e -7.6772 (copiar do Google Maps)" }
      - { label: "Link da petição ou consulta (botão de ação)", name: pet, widget: string, required: false }
      - { label: "Links dos envolvidos (site ou rede de cada coletivo)", name: quemLinks, required: false, widget: list, field: { label: "Link", name: url, widget: string, required: false }, hint: "Pela mesma ordem da lista \"Quem está envolvido\". Deixar vazio quem não tem site." }
      - label: "Recolha de fundos (botão Apoiar com donativo)"
        name: fundos
        widget: list
        required: false
        hint: "Só recolhas de quem luta neste conflito (GoFundMe, PPL, página de donativos do movimento)."
        fields:
          - { label: "Quem recolhe (aparece no botão)", name: titulo, widget: string }
          - { label: "Quem recolhe, em inglês (opcional)", name: tituloEn, widget: string, required: false }
          - { label: "Link da recolha de fundos", name: url, widget: string }
      - { label: "Caso local, sem imprensa (mostra aviso na ficha)", name: local, widget: boolean, required: false, default: false, hint: "Só com pelo menos 2 fontes primárias abertas e lidas (petição com texto integral, ata, edital, comunicado do movimento)." }
      - { label: "Caso em construção (só por link, fora do mapa)", name: emConstrucao, widget: boolean, required: false, default: false }
      - label: "Foto"
        name: image
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Foto do caso (carregar; só fotos próprias ou autorizadas)", name: folderFile, required: false, widget: image, choose_url: false, hint: "JPG, a maior resolução possível. Guarda o ficheiro com o identificador do caso no nome." }
          - { label: "Ficheiro de partilha (deixa vazio: é preenchido sozinho)", name: rootFile, required: false, widget: string }
          - { label: "Crédito da imagem (opcional, ex.: Imagem: Google Earth)", name: credito, required: false, widget: string }
          - { label: "Só na raiz", name: imgRootOnly, required: false, widget: boolean, default: false }
          - { label: "Enquadramento da foto na ficha (opcional, ex.: 50% 10% para mostrar a parte de cima)", name: pos, required: false, widget: string, hint: "Primeiro número: esquerda (0%) a direita (100%). Segundo: topo (0%) a fundo (100%). Vazio: centro." }
      - label: "Português"
        name: pt
        widget: object
        collapsed: false
        fields:
          - { label: "Título", name: t, widget: string, hint: "Ancorado ao objeto do conflito (o lugar, o projeto), nunca ao ator mais recente. Sem travessões." }
          - { label: "Localização", name: loc, required: false, widget: string }
          - { label: "Nome do tema (como aparece no site)", name: catLabel, required: false, widget: string }
          - { label: "Estado atual (uma frase)", name: status, required: false, widget: string }
          - { label: "Quem está envolvido", name: quem, required: false, widget: list, field: { label: "Organização ou movimento", name: nome, widget: string } }
          - { label: "Resumo", name: res, widget: text }
          - { label: "Texto do botão de ação", name: petLabel, widget: string, required: false, hint: "Ex.: ⚡ Assinar a petição →  (petição ativa: nunca escrever número de assinaturas)" }
          - { label: "Palavras de pesquisa", name: kw, widget: list, required: false, field: { label: "Palavra", name: p, widget: string } }
          - label: "Ficha"
            name: ficha
            widget: object
            required: false
            fields:
              - { label: "Texto da ficha (HTML: um <p>...</p> por parágrafo, com data)", name: corpo, required: false, widget: text }
              - { label: "O que está em causa (um parágrafo, sem atores; usado com a cronologia)", name: contexto, required: false, widget: text }
              - label: "Cronologia (se existir, substitui o texto da ficha; cada link tem de estar nas Fontes)"
                name: cronologia
                widget: list
                required: false
                summary: "{{fields.data}}: {{fields.texto}}"
                fields:
                  - { label: "Data (AAAA, AAAA-MM ou AAAA-MM-DD, só a precisão que a fonte dá)", name: data, widget: string, pattern: ['^\d{4}(-\d{2}(-\d{2})?)?$', 'Formato AAAA, AAAA-MM ou AAAA-MM-DD'] }
                  - { label: "Até (opcional, AAAA-MM-DD, para períodos de vários dias)", name: dataFim, widget: string, required: false }
                  - { label: "O que aconteceu (1 ou 2 frases, máx. 400 caracteres)", name: texto, widget: text }
                  - { label: "Link da fonte (igual a um da lista de Fontes)", name: fonte, widget: string }
              - label: "Fontes (cada link uma só vez)"
                name: fontes
                widget: list
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título da fonte", name: titulo, required: false, widget: string }
                  - { label: "Link (https://...)", name: url, required: false, widget: string, pattern: ['^https?://', 'Tem de começar por https://'] }
              - { label: "Destaque (número ou frase curta)", name: stat, widget: string, required: false }
              - { label: "Ligação principal", name: link, widget: string, required: false }
              - { label: "Texto da ligação principal", name: linkL, widget: string, required: false }
      - label: "English"
        name: en
        widget: object
        collapsed: false
        fields:
          - { label: "Título", name: t, widget: string, hint: "Ancorado ao objeto do conflito (o lugar, o projeto), nunca ao ator mais recente. Sem travessões." }
          - { label: "Localização", name: loc, required: false, widget: string }
          - { label: "Nome do tema (como aparece no site)", name: catLabel, required: false, widget: string }
          - { label: "Estado atual (uma frase)", name: status, required: false, widget: string }
          - { label: "Quem está envolvido", name: quem, required: false, widget: list, field: { label: "Organização ou movimento", name: nome, widget: string } }
          - { label: "Resumo", name: res, widget: text }
          - { label: "Texto do botão de ação", name: petLabel, widget: string, required: false, hint: "Ex.: ⚡ Assinar a petição →  (petição ativa: nunca escrever número de assinaturas)" }
          - { label: "Palavras de pesquisa", name: kw, widget: list, required: false, field: { label: "Palavra", name: p, widget: string } }
          - label: "Ficha"
            name: ficha
            widget: object
            required: false
            fields:
              - { label: "Texto da ficha (HTML: um <p>...</p> por parágrafo, com data)", name: corpo, required: false, widget: text }
              - { label: "O que está em causa (um parágrafo, sem atores; usado com a cronologia)", name: contexto, required: false, widget: text }
              - label: "Cronologia (se existir, substitui o texto da ficha; cada link tem de estar nas Fontes)"
                name: cronologia
                widget: list
                required: false
                summary: "{{fields.data}}: {{fields.texto}}"
                fields:
                  - { label: "Data (AAAA, AAAA-MM ou AAAA-MM-DD, só a precisão que a fonte dá)", name: data, widget: string, pattern: ['^\d{4}(-\d{2}(-\d{2})?)?$', 'Formato AAAA, AAAA-MM ou AAAA-MM-DD'] }
                  - { label: "Até (opcional, AAAA-MM-DD, para períodos de vários dias)", name: dataFim, widget: string, required: false }
                  - { label: "O que aconteceu (1 ou 2 frases, máx. 400 caracteres)", name: texto, widget: text }
                  - { label: "Link da fonte (igual a um da lista de Fontes)", name: fonte, widget: string }
              - label: "Fontes (cada link uma só vez)"
                name: fontes
                widget: list
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título da fonte", name: titulo, required: false, widget: string }
                  - { label: "Link (https://...)", name: url, required: false, widget: string, pattern: ['^https?://', 'Tem de começar por https://'] }
              - { label: "Destaque (número ou frase curta)", name: stat, widget: string, required: false }
              - { label: "Ligação principal", name: link, widget: string, required: false }
              - { label: "Texto da ligação principal", name: linkL, widget: string, required: false }
