# Editor Causas de Raiz (Sveltia CMS) em https://causasderaiz.org/admin/
# Grava diretamente no ramo main (decisão da Sílvia, 3 out. 2026: colaboradores autónomos);
# (junção de rascunhos em main; a publicação automática só corre em main).
# Login: GitHub, através do serviço sveltia-cms-auth no Cloudflare (conta do Causas de Raiz).
backend:
  name: github
  repo: causasderaiz/causasderaiz-src
  branch: main
  base_url: https://sveltia-cms-auth.causasderaiz.workers.dev
  commit_messages:
    create: "Editor: novo caso {{slug}}"
    update: "Editor: atualiza {{slug}}"
    delete: "Editor: apaga {{slug}}"
    uploadMedia: "Editor: carrega foto {{path}}"
    deleteMedia: "Editor: apaga foto {{path}}"
locale: pt
media_folder: src/images/originals/img
public_folder: /img
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: casos
    label: "Casos"
    label_singular: "Caso"
    folder: src/casos
    extension: json
    format: json
    create: true
    identifier_field: id
    slug: "{{fields.id}}"
    summary: "{{num}} · {{pt.t}}"
    sortable_fields: [num, verif]
    fields:
      - { label: "Identificador (vira o endereço da página)", name: id, widget: string, pattern: ['^[a-z0-9-]+$', 'Só letras minúsculas, números e hífenes'] }
      - { label: "Número do caso", name: num, widget: number, value_type: int, hint: "Usar o número livre mais baixo (reports/numeros-livres.md)" }
      - { label: "Região", name: reg, widget: select, options: [{label: "Norte", value: "norte"}, {label: "Centro", value: "centro"}, {label: "Lisboa e Vale do Tejo", value: "lisboa-e-vale-do-tejo"}, {label: "Alentejo", value: "alentejo"}, {label: "Algarve", value: "algarve"}, {label: "Madeira", value: "madeira"}, {label: "Açores", value: "acores"}, {label: "Nacional", value: "nacional"}] }
      - { label: "Tema", name: cat, widget: select, options: [{label: "Energia", value: "energia"}, {label: "Eólicas", value: "eolicas"}, {label: "MegaSolares", value: "megasolares"}, {label: "Mineração", value: "mineracao"}, {label: "Água", value: "agua"}, {label: "Imobiliário / Ordenamento", value: "imobiliario"}, {label: "Praias", value: "praias"}, {label: "Infraestrutura", value: "infraestrutura"}, {label: "Data center", value: "datacenter"}, {label: "Comunidade", value: "comunidade"}, {label: "Incêndios", value: "incendios"}, {label: "Racismo ambiental", value: "racismo-ambiental"}, {label: "Poluição", value: "poluicao"}, {label: "Arvoredo urbano", value: "arvoredo"}, {label: "Biodiversidade", value: "biodiversidade"}] }
      - { label: "Outros temas", name: cat2, widget: select, multiple: true, required: false, options: [{label: "Energia", value: "energia"}, {label: "Eólicas", value: "eolicas"}, {label: "MegaSolares", value: "megasolares"}, {label: "Mineração", value: "mineracao"}, {label: "Água", value: "agua"}, {label: "Imobiliário / Ordenamento", value: "imobiliario"}, {label: "Praias", value: "praias"}, {label: "Infraestrutura", value: "infraestrutura"}, {label: "Data center", value: "datacenter"}, {label: "Comunidade", value: "comunidade"}, {label: "Incêndios", value: "incendios"}, {label: "Racismo ambiental", value: "racismo-ambiental"}, {label: "Poluição", value: "poluicao"}, {label: "Arvoredo urbano", value: "arvoredo"}, {label: "Biodiversidade", value: "biodiversidade"}] }
      - { label: "Estado", name: est, widget: select, options: [{label: "Situação ativa", value: "urgente"}, {label: "Consulta pública", value: "consulta"}, {label: "Processo judicial", value: "tribunal"}, {label: "Vitória", value: "vitoria"}, {label: "Acompanhamento", value: "acompanhamento"}] }
      - { label: "Prazo a fechar", name: prazo, required: false, widget: boolean, default: false }
      - { label: "Verificado em (data em que leste as fontes)", name: verif, widget: datetime, time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Coordenadas [latitude, longitude]", name: ll, required: false, widget: list, field: { label: "Coordenada", name: c, widget: number, value_type: float }, hint: "Ex.: 41.6897 e -7.6772 (copiar do Google Maps)" }
      - { label: "Link da petição ou consulta (botão de ação)", name: pet, widget: string, required: false }
      - { label: "Caso em construção (só por link, fora do mapa)", name: emConstrucao, widget: boolean, required: false, default: false }
      - label: "Foto"
        name: image
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Foto do caso (carregar; só fotos próprias ou autorizadas)", name: folderFile, required: false, widget: image, choose_url: false, hint: "JPG, a maior resolução possível. Guarda o ficheiro com o identificador do caso no nome." }
          - { label: "Ficheiro de partilha (deixa vazio: é preenchido sozinho)", name: rootFile, required: false, widget: string }
          - { label: "Só na raiz", name: imgRootOnly, required: false, widget: boolean, default: false }
      - label: "Português"
        name: pt
        widget: object
        collapsed: false
        fields:
          - { label: "Título", name: t, widget: string, hint: "Ancorado ao objeto do conflito (o lugar, o projeto), nunca ao ator mais recente. Sem travessões." }
          - { label: "Localização", name: loc, required: false, widget: string }
          - { label: "Nome do tema (como aparece no site)", name: catLabel, required: false, widget: string }
          - { label: "Estado atual (uma frase)", name: status, required: false, widget: string }
          - { label: "Quem está envolvido", name: quem, required: false, widget: list, field: { label: "Organização ou movimento", name: nome, widget: string } }
          - { label: "Resumo", name: res, widget: text }
          - { label: "Texto do botão de ação", name: petLabel, widget: string, required: false, hint: "Ex.: ⚡ Assinar a petição →  (petição ativa: nunca escrever número de assinaturas)" }
          - { label: "Palavras de pesquisa", name: kw, widget: list, required: false, field: { label: "Palavra", name: p, widget: string } }
          - label: "Ficha"
            name: ficha
            widget: object
            required: false
            fields:
              - { label: "Texto da ficha (HTML: um <p>...</p> por parágrafo, com data)", name: corpo, required: false, widget: text }
              - label: "Fontes (cada link uma só vez)"
                name: fontes
                widget: list
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título da fonte", name: titulo, required: false, widget: string }
                  - { label: "Link (https://...)", name: url, required: false, widget: string, pattern: ['^https?://', 'Tem de começar por https://'] }
              - { label: "Destaque (número ou frase curta)", name: stat, widget: string, required: false }
              - { label: "Ligação principal", name: link, widget: string, required: false }
              - { label: "Texto da ligação principal", name: linkL, widget: string, required: false }
      - label: "English"
        name: en
        widget: object
        collapsed: false
        fields:
          - { label: "Título", name: t, widget: string, hint: "Ancorado ao objeto do conflito (o lugar, o projeto), nunca ao ator mais recente. Sem travessões." }
          - { label: "Localização", name: loc, required: false, widget: string }
          - { label: "Nome do tema (como aparece no site)", name: catLabel, required: false, widget: string }
          - { label: "Estado atual (uma frase)", name: status, required: false, widget: string }
          - { label: "Quem está envolvido", name: quem, required: false, widget: list, field: { label: "Organização ou movimento", name: nome, widget: string } }
          - { label: "Resumo", name: res, widget: text }
          - { label: "Texto do botão de ação", name: petLabel, widget: string, required: false, hint: "Ex.: ⚡ Assinar a petição →  (petição ativa: nunca escrever número de assinaturas)" }
          - { label: "Palavras de pesquisa", name: kw, widget: list, required: false, field: { label: "Palavra", name: p, widget: string } }
          - label: "Ficha"
            name: ficha
            widget: object
            required: false
            fields:
              - { label: "Texto da ficha (HTML: um <p>...</p> por parágrafo, com data)", name: corpo, required: false, widget: text }
              - label: "Fontes (cada link uma só vez)"
                name: fontes
                widget: list
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título da fonte", name: titulo, required: false, widget: string }
                  - { label: "Link (https://...)", name: url, required: false, widget: string, pattern: ['^https?://', 'Tem de começar por https://'] }
              - { label: "Destaque (número ou frase curta)", name: stat, widget: string, required: false }
              - { label: "Ligação principal", name: link, widget: string, required: false }
              - { label: "Texto da ligação principal", name: linkL, widget: string, required: false }
  - name: boletins
    label: "Boletim A Raiz"
    label_singular: "Edição"
    folder: src/boletins
    extension: json
    format: json
    create: false
    identifier_field: id
    summary: "N.º {{num}} · {{estacao}} ({{estado}})"
    description: "Boletim trimestral. Cada edição nova é criada pela equipa (a partir do mapa); aqui preenchem-se os textos, gráficos, filmes e regeneração. Fica em rascunho até a Sílvia aprovar."
    fields:
      - { label: "Edição (AAAA-MM)", name: id, widget: string, hint: "Não mudar." }
      - { label: "Número", name: num, widget: number, value_type: int }
      - { label: "Estado", name: estado, widget: select, options: [{label: "Rascunho (protótipo só por link)", value: "rascunho"}, {label: "Publicado (só com OK da Sílvia)", value: "publicado"}], default: "rascunho" }
      - { label: "Estação (aparece na capa)", name: estacao, widget: string, hint: "Ex.: Outono 2026" }
      - { label: "Data da edição", name: data, widget: datetime, time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Período desde", name: desde, widget: datetime, time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Abertura (2 ou 3 frases, só factos do mapa)", name: intro, widget: text }
      - label: "Capa: fotos dos quatro elementos (identificador do caso cuja foto se usa)"
        name: capa
        widget: object
        fields:
          - { label: "Água", name: agua, widget: string }
          - { label: "Ar", name: ar, widget: string }
          - { label: "Terra", name: terra, widget: string }
          - { label: "Fogo", name: fogo, widget: string }
      - label: "Números (preenchidos a partir do mapa; não mudar à mão)"
        name: numeros
        widget: object
        collapsed: true
        fields:
          - { label: "Casos no mapa", name: casos, widget: number, value_type: int }
          - { label: "Com ação aberta", name: comAcao, widget: number, value_type: int }
          - { label: "Organizações", name: organizacoes, widget: number, value_type: int }
          - { label: "Novos", name: novos, widget: number, value_type: int }
      - { label: "Casos novos (não mudar)", name: novos, widget: list, required: false, collapsed: true, field: { label: "Caso", name: id, widget: string } }
      - { label: "Casos com novidades (não mudar)", name: atualizados, widget: list, required: false, collapsed: true, field: { label: "Caso", name: id, widget: string } }
      - { label: "Casos com ação aberta (não mudar)", name: acao, widget: list, required: false, collapsed: true, field: { label: "Caso", name: id, widget: string } }
      - label: "Os quatro elementos"
        name: elementos
        widget: list
        allow_add: false
        allow_remove: false
        allow_reorder: false
        summary: "{{fields.nome}}"
        fields:
          - { label: "Elemento (não mudar)", name: id, widget: select, options: ["agua", "terra", "fogo", "ar"] }
          - { label: "Nome", name: nome, widget: string }
          - { label: "Palavras do índice", name: indice, widget: string, required: false }
          - { label: "Foto de abertura (identificador do caso)", name: foto, widget: string }
          - { label: "Frase de abertura", name: sub, widget: string }
          - label: "Em números (gráfico animado)"
            name: grafico
            widget: object
            fields:
              - { label: "Tipo de gráfico", name: tipo, widget: select, options: [{label: "Barras (comparar valores)", value: "barras"}, {label: "Colunas (série de anos)", value: "colunas"}, {label: "Um número grande", value: "numero"}] }
              - { label: "Título", name: titulo, widget: string }
              - label: "Valores"
                name: itens
                widget: list
                required: false
                summary: "{{fields.rotulo}}: {{fields.valor}}{{fields.v}}"
                fields:
                  - { label: "Rótulo (ex.: 2018)", name: rotulo, widget: string }
                  - { label: "Barras: valor escrito (ex.: 36 073 ha)", name: valor, widget: string, required: false }
                  - { label: "Barras: largura em % (0 a 100)", name: pct, widget: number, value_type: float, required: false }
                  - { label: "Barras: cor (ex.: var(--agua))", name: cor, widget: string, required: false }
                  - { label: "Colunas: valor (número)", name: v, widget: number, value_type: float, required: false }
                  - { label: "Colunas: valor provisório", name: provisorio, widget: boolean, required: false }
              - { label: "Número grande (tipo número)", name: numero, widget: number, value_type: float, required: false }
              - { label: "Unidade do número grande", name: unidade, widget: string, required: false }
              - { label: "Destaque (ex.: +143%)", name: destaque, widget: string, required: false }
              - { label: "Ondas animadas (água)", name: ondas, widget: boolean, required: false }
              - { label: "Texto por baixo (pode ter <b>negrito</b>)", name: texto, widget: text }
              - { label: "Fonte dos dados (obrigatória)", name: fonte, widget: string }
          - label: "Filme"
            name: filme
            widget: object
            required: false
            fields:
              - { label: "Código do vídeo do YouTube (o que vem depois de v=)", name: youtube, widget: string, required: false }
              - { label: "Título", name: titulo, widget: string, required: false }
              - { label: "Crédito (autor / realização)", name: credito, widget: string, required: false }
          - label: "Regeneração (quem constrói a alternativa)"
            name: regeneracao
            widget: object
            required: false
            fields:
              - { label: "Título", name: titulo, widget: string, required: false }
              - { label: "Texto (2 ou 3 frases; 'POR ESCOLHER' esconde o bloco na edição publicada)", name: texto, widget: text, required: false }
              - { label: "Vídeo do YouTube (código), se houver", name: youtube, widget: string, required: false }
              - { label: "Crédito do vídeo", name: credito, widget: string, required: false }
              - { label: "Foto (carregar; só fotos próprias ou autorizadas), se não houver vídeo", name: foto, widget: image, required: false, media_folder: "/src/estatico/img-boletim", public_folder: "/img-boletim", choose_url: false, hint: "JPG, de preferência com 1600 px ou mais de largura." }
              - { label: "Crédito da foto (quem a tirou)", name: fotoCredito, widget: string, required: false }
              - label: "Fonte"
                name: fonte
                widget: object
                required: false
                fields:
                  - { label: "Título da fonte", name: titulo, widget: string, required: false }
                  - { label: "Link", name: url, widget: string, required: false }
          - { label: "Casos para agir (identificadores, 3)", name: agir, widget: list, field: { label: "Caso", name: id, widget: string } }
      - label: "Animação do trimestre"
        name: reel
        widget: object
        required: false
        fields:
          - { label: "Vídeo MP4 (endereço), quando existir", name: mp4, widget: string, required: false }
          - { label: "Número em destaque (enquanto não há vídeo)", name: numero, widget: string, required: false }
          - { label: "Frase", name: frase, widget: string, required: false }
