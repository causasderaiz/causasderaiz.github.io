# Editor Causas de Raiz (Sveltia CMS) em https://causasderaiz.org/admin/
# Grava diretamente no ramo main (decisão da Sílvia, 3 out. 2026: colaboradores autónomos);
# (junção de rascunhos em main; a publicação automática só corre em main).
# Login: GitHub, através do serviço sveltia-cms-auth no Cloudflare (conta do Causas de Raiz).
backend:
  name: github
  repo: causasderaiz/causasderaiz-src
  branch: main
  base_url: https://sveltia-cms-auth.causasderaiz.workers.dev
  commit_messages:
    create: "Editor: novo caso {{slug}}"
    update: "Editor: atualiza {{slug}}"
    delete: "Editor: apaga {{slug}}"
    uploadMedia: "Editor: carrega foto {{path}}"
    deleteMedia: "Editor: apaga foto {{path}}"
locale: pt
media_folder: src/images/originals/img
public_folder: /img
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: casos
    label: "Casos"
    label_singular: "Caso"
    folder: src/casos
    extension: json
    format: json
    create: true
    identifier_field: id
    slug: "{{fields.id}}"
    summary: "{{num}} · {{pt.t}}"
    sortable_fields: [num, verif]
    fields:
      - { label: "Identificador (vira o endereço da página)", name: id, widget: string, pattern: ['^[a-z0-9-]+$', 'Só letras minúsculas, números e hífenes'] }
      - { label: "Número do caso", name: num, widget: number, value_type: int, hint: "Usar o número livre mais baixo (reports/numeros-livres.md)" }
      - { label: "Região", name: reg, widget: select, options: [{label: "Norte", value: "norte"}, {label: "Centro", value: "centro"}, {label: "Lisboa e Vale do Tejo", value: "lisboa-e-vale-do-tejo"}, {label: "Alentejo", value: "alentejo"}, {label: "Algarve", value: "algarve"}, {label: "Madeira", value: "madeira"}, {label: "Açores", value: "acores"}, {label: "Nacional", value: "nacional"}] }
      - { label: "Tema", name: cat, widget: select, options: [{label: "Energia", value: "energia"}, {label: "Eólicas", value: "eolicas"}, {label: "MegaSolares", value: "megasolares"}, {label: "Mineração", value: "mineracao"}, {label: "Água", value: "agua"}, {label: "Imobiliário / Ordenamento", value: "imobiliario"}, {label: "Praias", value: "praias"}, {label: "Infraestrutura", value: "infraestrutura"}, {label: "Data center", value: "datacenter"}, {label: "Comunidade", value: "comunidade"}, {label: "Incêndios", value: "incendios"}, {label: "Racismo ambiental", value: "racismo-ambiental"}, {label: "Poluição", value: "poluicao"}, {label: "Arvoredo urbano", value: "arvoredo"}, {label: "Biodiversidade", value: "biodiversidade"}] }
      - { label: "Outros temas", name: cat2, widget: select, multiple: true, required: false, options: [{label: "Energia", value: "energia"}, {label: "Eólicas", value: "eolicas"}, {label: "MegaSolares", value: "megasolares"}, {label: "Mineração", value: "mineracao"}, {label: "Água", value: "agua"}, {label: "Imobiliário / Ordenamento", value: "imobiliario"}, {label: "Praias", value: "praias"}, {label: "Infraestrutura", value: "infraestrutura"}, {label: "Data center", value: "datacenter"}, {label: "Comunidade", value: "comunidade"}, {label: "Incêndios", value: "incendios"}, {label: "Racismo ambiental", value: "racismo-ambiental"}, {label: "Poluição", value: "poluicao"}, {label: "Arvoredo urbano", value: "arvoredo"}, {label: "Biodiversidade", value: "biodiversidade"}] }
      - { label: "Estado", name: est, widget: select, options: [{label: "Situação ativa", value: "urgente"}, {label: "Consulta pública", value: "consulta"}, {label: "Processo judicial", value: "tribunal"}, {label: "Vitória", value: "vitoria"}, {label: "Acompanhamento", value: "acompanhamento"}] }
      - { label: "Prazo a fechar", name: prazo, required: false, widget: boolean, default: false }
      - { label: "Verificado em (data em que leste as fontes)", name: verif, widget: datetime, time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Coordenadas [latitude, longitude]", name: ll, required: false, widget: list, field: { label: "Coordenada", name: c, widget: number, value_type: float }, hint: "Ex.: 41.6897 e -7.6772 (copiar do Google Maps)" }
      - { label: "Link da petição ou consulta (botão de ação)", name: pet, widget: string, required: false }
      - { label: "Caso em construção (só por link, fora do mapa)", name: emConstrucao, widget: boolean, required: false, default: false }
      - label: "Foto"
        name: image
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "Foto do caso (carregar; só fotos próprias ou autorizadas)", name: folderFile, required: false, widget: image, choose_url: false, hint: "JPG, a maior resolução possível. Guarda o ficheiro com o identificador do caso no nome." }
          - { label: "Ficheiro de partilha (deixa vazio: é preenchido sozinho)", name: rootFile, required: false, widget: string }
          - { label: "Só na raiz", name: imgRootOnly, required: false, widget: boolean, default: false }
      - label: "Português"
        name: pt
        widget: object
        collapsed: false
        fields:
          - { label: "Título", name: t, widget: string, hint: "Ancorado ao objeto do conflito (o lugar, o projeto), nunca ao ator mais recente. Sem travessões." }
          - { label: "Localização", name: loc, required: false, widget: string }
          - { label: "Nome do tema (como aparece no site)", name: catLabel, required: false, widget: string }
          - { label: "Estado atual (uma frase)", name: status, required: false, widget: string }
          - { label: "Quem está envolvido", name: quem, required: false, widget: list, field: { label: "Organização ou movimento", name: nome, widget: string } }
          - { label: "Resumo", name: res, widget: text }
          - { label: "Texto do botão de ação", name: petLabel, widget: string, required: false, hint: "Ex.: ⚡ Assinar a petição →  (petição ativa: nunca escrever número de assinaturas)" }
          - { label: "Palavras de pesquisa", name: kw, widget: list, required: false, field: { label: "Palavra", name: p, widget: string } }
          - label: "Ficha"
            name: ficha
            widget: object
            required: false
            fields:
              - { label: "Texto da ficha (HTML: um <p>...</p> por parágrafo, com data)", name: corpo, required: false, widget: text }
              - label: "Fontes (cada link uma só vez)"
                name: fontes
                widget: list
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título da fonte", name: titulo, required: false, widget: string }
                  - { label: "Link (https://...)", name: url, required: false, widget: string, pattern: ['^https?://', 'Tem de começar por https://'] }
              - { label: "Destaque (número ou frase curta)", name: stat, widget: string, required: false }
              - { label: "Ligação principal", name: link, widget: string, required: false }
              - { label: "Texto da ligação principal", name: linkL, widget: string, required: false }
      - label: "English"
        name: en
        widget: object
        collapsed: false
        fields:
          - { label: "Título", name: t, widget: string, hint: "Ancorado ao objeto do conflito (o lugar, o projeto), nunca ao ator mais recente. Sem travessões." }
          - { label: "Localização", name: loc, required: false, widget: string }
          - { label: "Nome do tema (como aparece no site)", name: catLabel, required: false, widget: string }
          - { label: "Estado atual (uma frase)", name: status, required: false, widget: string }
          - { label: "Quem está envolvido", name: quem, required: false, widget: list, field: { label: "Organização ou movimento", name: nome, widget: string } }
          - { label: "Resumo", name: res, widget: text }
          - { label: "Texto do botão de ação", name: petLabel, widget: string, required: false, hint: "Ex.: ⚡ Assinar a petição →  (petição ativa: nunca escrever número de assinaturas)" }
          - { label: "Palavras de pesquisa", name: kw, widget: list, required: false, field: { label: "Palavra", name: p, widget: string } }
          - label: "Ficha"
            name: ficha
            widget: object
            required: false
            fields:
              - { label: "Texto da ficha (HTML: um <p>...</p> por parágrafo, com data)", name: corpo, required: false, widget: text }
              - label: "Fontes (cada link uma só vez)"
                name: fontes
                widget: list
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { label: "Título da fonte", name: titulo, required: false, widget: string }
                  - { label: "Link (https://...)", name: url, required: false, widget: string, pattern: ['^https?://', 'Tem de começar por https://'] }
              - { label: "Destaque (número ou frase curta)", name: stat, widget: string, required: false }
              - { label: "Ligação principal", name: link, widget: string, required: false }
              - { label: "Texto da ligação principal", name: linkL, widget: string, required: false }
  - name: boletins
    label: "Boletim A Raiz"
    label_singular: "Edição"
    folder: src/boletins
    extension: json
    format: json
    create: false
    identifier_field: id
    summary: "N.º {{num}} · {{estacao}} ({{estado}})"
    description: "Boletim trimestral. A equipa cria cada edição a partir do mapa; aqui preenchem-se textos, fotos, vídeos e casos. Enquanto o Estado for Rascunho, só se vê por link."
    fields:
      - { label: "Edição (AAAA-MM)", name: id, widget: string, hint: "Não mudar." }
      - { label: "Número", name: num, widget: number, value_type: int }
      - { label: "Estado", name: estado, widget: select, options: [{label: "Rascunho (protótipo só por link)", value: "rascunho"}, {label: "Publicado (aparece no site e no RSS)", value: "publicado"}], default: "rascunho" }
      - { label: "Estação", name: estacao, widget: string, hint: "Ex.: Outono 2026" }
      - { label: "Data da edição", name: data, widget: datetime, time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Período desde", name: desde, widget: datetime, time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Título (parte a preto)", name: titulo, widget: string }
      - { label: "Título (parte a verde, no fim)", name: tituloVerde, widget: string, required: false }
      - { label: "Subtítulo", name: subtitulo, widget: text }
      - label: "Imagem de abertura"
        name: hero
        widget: object
        fields:
          - { label: "Caso cuja foto se usa (identificador)", name: caso, widget: string, required: false }
          - { label: "Ou carregar outra foto", name: foto, widget: image, required: false, media_folder: "/src/estatico/img-boletim", public_folder: "/img-boletim", choose_url: false }
          - { label: "Ou vídeo do YouTube (código)", name: youtube, widget: string, required: false }
          - { label: "Legenda", name: legenda, widget: string, required: false }
      - label: "Tempos de leitura (Quanto tempo tens?)"
        name: niveis
        widget: object
        collapsed: true
        fields:
          - { label: "Superfície", name: superficie, widget: string }
          - { label: "Tronco", name: tronco, widget: string }
          - { label: "Raiz", name: raiz, widget: string }
      - label: "Em 30 segundos (3 cartões)"
        name: trinta
        widget: list
        summary: "{{fields.valor}}"
        fields:
          - { label: "Tipo", name: tipo, widget: select, options: [{label: "Número", value: "numero"}, {label: "Barra de quadrados (ex.: 7 em 10)", value: "barra"}] }
          - { label: "Valor em destaque (ex.: 65 mil)", name: valor, widget: string }
          - { label: "Texto (com período e, se preciso, fonte)", name: texto, widget: string }
          - { label: "Cor", name: cor, widget: select, options: [{label: "Laranja", value: "laranja"}, {label: "Verde", value: "verde"}], default: "laranja" }
          - { label: "Barra: quadrados cheios", name: n, widget: number, value_type: int, required: false }
          - { label: "Barra: total de quadrados", name: de, widget: number, value_type: int, required: false }
      - label: "O caso do trimestre (vai no capítulo Fogo)"
        name: caso
        widget: object
        fields:
          - { label: "Caso (identificador)", name: caso, widget: string }
          - { label: "Tempo de leitura", name: tempo, widget: string }
          - { label: "Título", name: titulo, widget: string }
          - { label: "Texto (só factos da ficha do caso)", name: texto, widget: text }
          - { label: "Fontes e data de verificação", name: fonte, widget: string }
      - label: "02 Aprender"
        name: aprender
        widget: object
        fields:
          - { label: "Tempo de leitura", name: tempo, widget: string }
          - { label: "Pergunta / título", name: titulo, widget: string }
          - { label: "Explicação", name: texto, widget: text }
          - { label: "Vídeo do YouTube (código)", name: youtube, widget: string, required: false }
          - { label: "Duração do vídeo (ex.: 1:30)", name: duracao, widget: string, required: false }
          - label: "Conceitos"
            name: conceitos
            widget: list
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome", name: nome, widget: string }
              - { label: "Explicação curta", name: texto, widget: text }
      - label: "03 Regenerar"
        name: regenerar
        widget: object
        fields:
          - { label: "Tempo de leitura", name: tempo, widget: string }
          - { label: "Título", name: titulo, widget: string }
          - label: "Momentos (3)"
            name: itens
            widget: list
            summary: "{{fields.etiqueta}}"
            fields:
              - { label: "Etiqueta (ex.: Semanas)", name: etiqueta, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Foto (só própria ou autorizada)", name: foto, widget: image, required: false, media_folder: "/src/estatico/img-boletim", public_folder: "/img-boletim", choose_url: false }
          - label: "Fonte"
            name: fonte
            widget: object
            required: false
            fields:
              - { label: "Título da fonte", name: titulo, widget: string, required: false }
              - { label: "Link", name: url, widget: string, required: false }
      - label: "04 Biodiversidade: espécies em perigo"
        name: biodiversidade
        widget: object
        required: false
        fields:
          - { label: "Tempo de leitura", name: tempo, widget: string }
          - { label: "Título", name: titulo, widget: string }
          - label: "Espécies"
            name: especies
            widget: list
            summary: "{{fields.nome}}"
            fields:
              - { label: "Nome comum", name: nome, widget: string }
              - { label: "Nome científico", name: cientifico, widget: string, required: false }
              - { label: "Ilustração ou foto (autorizada)", name: img, widget: image, required: false, media_folder: "/src/estatico/img-boletim", public_folder: "/img-boletim", choose_url: false }
              - { label: "Crédito da foto", name: fotoCredito, widget: string, required: false }
              - { label: "Número em destaque (ex.: 1 736)", name: numero, widget: string }
              - { label: "O que é o número (com período e fonte)", name: unidade, widget: string }
              - { label: "Barra: quadrados que restam", name: restam, widget: number, value_type: int, required: false }
              - { label: "Barra: total de quadrados", name: de, widget: number, value_type: int, required: false }
              - { label: "Texto da barra (ex.: menos 90% desde 2006)", name: quedaTexto, widget: string, required: false }
              - { label: "Texto (ameaças e o que se pede, só com fonte)", name: texto, widget: text }
              - label: "Fonte"
                name: fonte
                widget: object
                fields:
                  - { label: "Título da fonte", name: titulo, widget: string }
                  - { label: "Link", name: url, widget: string }
      - label: "Em tribunal e a acompanhar"
        name: movimento
        widget: object
        fields:
          - { label: "Tempo de leitura", name: tempo, widget: string }
          - { label: "Casos (identificadores, 3)", name: casos, widget: list, field: { label: "Caso", name: id, widget: string } }
      - label: "O trimestre no mapa"
        name: mapa
        widget: object
        required: false
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Texto", name: texto, widget: text }
      - label: "Capítulos: Água, Terra, Fogo, Ar"
        name: elementos
        widget: list
        summary: "{{fields.titulo}}"
        fields:
          - { label: "Elemento", name: id, widget: select, options: [{label: "Água", value: "agua"}, {label: "Terra", value: "terra"}, {label: "Fogo", value: "fogo"}, {label: "Ar", value: "ar"}] }
          - { label: "Título", name: titulo, widget: string }
          - { label: "Índice (3 palavras)", name: indice, widget: string }
          - { label: "Frase sobre a foto", name: sub, widget: string }
          - { label: "Caso cuja foto se usa (identificador)", name: caso, widget: string, required: false }
          - { label: "Ou foto própria (autorizada)", name: foto, widget: image, required: false, media_folder: "/src/estatico/img-boletim", public_folder: "/img-boletim", choose_url: false }
          - label: "Gráfico animado"
            name: dado
            widget: object
            required: false
            fields:
              - { label: "Tipo", name: tipo, widget: select, options: [{label: "Barras", value: "barras"}, {label: "Colunas por ano", value: "colunas"}] }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Número em destaque", name: destaque, widget: string }
              - label: "Valores"
                name: itens
                widget: list
                summary: "{{fields.rotulo}}: {{fields.valor}}"
                fields:
                  - { label: "Rótulo (ex.: 2025)", name: rotulo, widget: string }
                  - { label: "Valor escrito (ex.: 87 760 ha)", name: valor, widget: string }
                  - { label: "Tamanho da barra (0 a 100)", name: pct, widget: number, value_type: int }
              - { label: "Texto", name: texto, widget: text }
              - { label: "Fonte", name: fonte, widget: string }
          - label: "Filmes"
            name: filmes
            widget: list
            required: false
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Código do YouTube (o que vem depois de v=)", name: youtube, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Crédito (autor / realização)", name: credito, widget: string, required: false }
          - { label: "Blocos extra neste capítulo", name: extras, widget: select, multiple: true, required: false, options: [{label: "Caso do trimestre", value: "caso"}, {label: "Biodiversidade", value: "biodiversidade"}, {label: "Reel", value: "reel"}, {label: "Regenerar", value: "regenerar"}] }
      - label: "Reel do trimestre"
        name: reel
        widget: object
        required: false
        fields:
          - { label: "Vídeo MP4", name: mp4, widget: file, media_folder: "/src/estatico/video", public_folder: "/video", choose_url: false }
          - { label: "Imagem de capa", name: poster, widget: image, required: false, media_folder: "/src/estatico/video", public_folder: "/video", choose_url: false }
          - { label: "Título", name: titulo, widget: string }
          - { label: "Texto", name: texto, widget: text }
          - label: "Fonte dos dados"
            name: fonte
            widget: object
            required: false
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Link", name: url, widget: string }
      - label: "Agir hoje"
        name: agirHoje
        widget: object
        fields:
          - { label: "Caso com petição para assinar (identificador)", name: assina, widget: string, required: false }
          - { label: "Caso com consulta para participar (identificador)", name: participa, widget: string, required: false }
          - { label: "Prazo da consulta (AAAA-MM-DD)", name: prazoParticipa, widget: string, required: false }
      - label: "Números (do mapa; não mudar)"
        name: numeros
        widget: object
        collapsed: true
        fields:
          - { label: "Casos no mapa", name: casos, widget: number, value_type: int }
          - { label: "Com ação aberta", name: comAcao, widget: number, value_type: int }
          - { label: "Organizações", name: organizacoes, widget: number, value_type: int }
          - { label: "Novos", name: novos, widget: number, value_type: int }
      - { label: "Casos novos (não mudar)", name: novos, widget: list, required: false, collapsed: true, field: { label: "Caso", name: id, widget: string } }
      - { label: "Casos com novidades (não mudar)", name: atualizados, widget: list, required: false, collapsed: true, field: { label: "Caso", name: id, widget: string } }
      - { label: "Casos com ação aberta (não mudar)", name: acao, widget: list, required: false, collapsed: true, field: { label: "Caso", name: id, widget: string } }
